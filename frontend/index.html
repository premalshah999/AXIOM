<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="description" content="AXIOM: your autonomous job application engine." />
    <title>AXIOM</title>
    <!-- Applies the saved theme before first paint so a reload never flashes the default. Keep this in step with
         readTheme in src/shell/prefs.ts: old stored values (maroon, ivory) mean light; everything else means dark. -->
    <script>
      (function () {
        var t = "dark";
        try {
          var v = localStorage.getItem("axiom.theme");
          if (v === "light" || v === "maroon" || v === "ivory") t = "light";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", t);
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", t === "light" ? "#fbf9f7" : "#0b1220");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
